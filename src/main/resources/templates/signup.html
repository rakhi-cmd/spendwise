<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>SpendWise - Register</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link th:href="@{/css/style.css}" rel="stylesheet">
	</head>
	<body>
		<div class="signup-page">
		    <div class="signup-container">
		        <!-- ================= LEFT SIDE ================= -->
		        <div class="signup-form-section">
		            <div class="signup-content">
		                <!-- Logo -->
		                <div class="brand">
		                    <span class="brand-icon">₹</span>
		                    <span class="brand-name">SpendWise</span>
		                </div>
		                <!-- Heading -->
		                <div class="signup-heading">
		                    <h1>Sign Up</h1>
		                    <p>
		                        Create your account and start managing
		                        your expenses smarter.
		                    </p>
		                </div>
		                <!-- ERROR MESSAGE --> 
		                <div th:if="${error}" class="alert alert-danger" role="alert"> 
		                	<span th:text="${error}"> Registration error </span> 
		                </div>
		                <!-- Signup Form -->
		                <form th:action="@{/register}" th:object="${user}" method="post">
		                    <!-- Name -->
		                    <div class="form-group">
		                        <label for="userName">Your Name</label>
		                        <input type="text" id="name" th:field="*{name}" name="name" class="form-control" placeholder="Enter your name" required>
		                    </div>
		                    <!-- Email -->
		                    <div class="form-group">
		                        <label for="email">Your Email</label>
		                        <input type="email" id="email" th:field="*{email}" name="email" class="form-control" placeholder="Enter your email" required>
		                    </div>
		                    <!-- Password -->
		                    <div class="form-group">
		                        <label for="password">Password</label>
		                        <input type="password" id="password" th:field="*{password}" name="password" class="form-control" placeholder="Create a password" required>
		                    </div>
		                    <!-- Confirm Password -->
		                    <div class="form-group">
		                        <label for="confirmPassword"> Repeat your password </label>
		                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat your password" required>
		                    </div>
		                    <!-- Terms -->
		                    <!-- <div class="terms-section">
		                        <input type="checkbox" id="terms" name="terms" required>
		                        <label for="terms">
		                            I agree all statements in
		                            <a href="#">Terms of service</a>
		                        </label>
		                    </div>-->
		                    <!-- Register Button -->
		                    <button type="submit" class="register-btn"> Register </button>
		                </form>
		                <!-- Login -->
		                <div class="login-section">
		 					<span>Already have an account?</span>
		                    <a th:href="@{/login}"> Login </a>
		                </div>
		            </div>
		        </div>
		        <!-- ================= RIGHT SIDE ================= -->
		        <div class="signup-image-section">
		            <div class="image-content">
		                <div class="image-heading">
		                    <h2>Manage your money<br>with confidence.</h2>
		                    <p>
		                        Track expenses, understand your spending
		                        and stay in control.
		                    </p>
		                </div>
		                <!-- Signup illustration -->
		                <img th:src="@{/images/signup-illustration.png}" alt="SpendWise illustration" class="signup-illustration">
		            </div>
		        </div>
		    </div>
		</div>
	</body>
	
	<script type="text/javascript">
		const password = document.getElementById("password"); 
		const confirmPassword = document.getElementById("confirmPassword"); 
		function checkPassword() { 
			if (confirmPassword.value !== "" && password.value !== confirmPassword.value) { 
				confirmPassword.setCustomValidity( "Passwords do not match." ); 
			} else { 
				confirmPassword.setCustomValidity(""); 
			} 
		} 
		password.addEventListener( "input", checkPassword ); 
		confirmPassword.addEventListener( "input", checkPassword ); 
	</script>
</html>
