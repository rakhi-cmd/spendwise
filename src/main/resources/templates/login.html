<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpendWise - Login</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link th:href="@{/css/style.css}" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="login-background">
	<div class="container">
		<div class="row justify-content-center align-items-center min-vh-100">

			<div class="col-md-5 col-lg-4">

				<div class="card shadow border-0">

					<div class="card-body p-4">

						<h2 class="text-center mb-2">SpendWise</h2>

						<p class="text-center text-muted mb-4">Manage your expenses
							easily</p>

						<!-- Login error -->
						<div th:if="${param.error}" class="alert alert-danger">
							Invalid username or password.</div>

						<!-- Logout message -->
						<div th:if="${param.logout}" class="alert alert-success">
							You have been logged out successfully.</div>

						<form th:action="@{/login}" method="post">

							<div class="mb-3">
								<label for="username" class="form-label"> Email </label> <input
									type="email" class="form-control" id="username" name="username"
									placeholder="Enter your email" required>
							</div>

							<div class="mb-3">
								<label for="password" class="form-label"> Password </label> <input
									type="password" class="form-control" id="password"
									name="password" placeholder="Enter your password" required>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-primary">Login</button>
							</div>

						</form>

						<div class="text-center mt-4">
							<span class="text-muted"> Don't have an account? </span> 
							<a th:href="@{signup}" class="text-decoration-none"> Register </a>
						</div>

					</div>
				</div>

			</div>
		</div>
	</div>
</body>
